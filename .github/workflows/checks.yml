name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin npm to a peer-resolution fix
        run: npm install --global npm@11.19.1
      - name: Install dependencies (lockfile pending)
        run: npm install --no-audit --no-fund
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
