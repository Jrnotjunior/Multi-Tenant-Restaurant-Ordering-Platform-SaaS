name: Edge Function checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check Supabase Edge Functions
        run: deno check --frozen --node-modules-dir=none supabase/functions/*/index.ts
      - name: Audit Edge Function dependencies
        run: deno audit --frozen-lockfile --level=moderate
